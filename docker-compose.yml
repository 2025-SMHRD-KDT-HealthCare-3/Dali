services:
  frontend:
    build: ./frontend
    container_name: dali-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      node:
        condition: service_healthy        # node가 "준비"될 때까지 대기

  node:
    build: ./node
    container_name: dali-node
    ports:
      - "3000:3000"
    volumes:
      - ./node:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      fastapi:
        condition: service_healthy        # fastapi가 "준비"될 때까지 대기
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fastapi:
    build: ./fastapi
    container_name: dali-fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi:/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s